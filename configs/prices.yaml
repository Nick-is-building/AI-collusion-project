# USD per 1M tokens. Source: PROJECT_PLAN.md section 6 (official pricing pages checked 23 Oct 2026).
# The cost tracker uses this table, not LiteLLM's cost map.
models:
  gemini/gemini-3.1-flash-lite:
    documented: true
    tiers:
      - {max_prompt_tokens: null, input: 0.25, cached_input: 0.025, output: 1.50}   # output includes thinking
  anthropic/claude-haiku-5-5:
    documented: true
    tiers:
      - {max_prompt_tokens: 100000, input: 0.10, cached_input: 0.01, output: 0.50}
      - {max_prompt_tokens: null, input: 0.50, cached_input: 0.05, output: 2.50}
  gemini/gemini-3.8-flash:
    # A16 (D39). Source: https://ai.google.dev/gemini-api/docs/pricing, read 25 Oct 2026 ~22:40 UTC, Gemini 3.8 Flash,
    # Standard paid tier: input $0.75, output (including thinking tokens) $3.75, context caching $0.075 per 1M tokens
    # "through December 31, 2026" (1.50 / 7.50 / 0.15 from January 1, 2027); no prompt-length tiers listed.
    documented: true
    tiers:
      - {max_prompt_tokens: null, input: 0.75, cached_input: 0.075, output: 3.75}   # output includes thinking
  gemini/gemini-3.7-flash:
    # NOT A DOCUMENTED PRICE. The model is no longer on the pricing page (plan 8.5).
    # Fail closed: the runner refuses calls to an undocumented model unless the caller passes
    # allow_undocumented_price (P1 availability call only). This conservative placeholder
    # (10x Flash-Lite) is used only to charge that single call against the caps.
    documented: false
    tiers:
      - {max_prompt_tokens: null, input: 2.50, cached_input: 0.25, output: 15.00}
